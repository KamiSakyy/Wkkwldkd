name: Build Lumi APK

on:
  push:
    branches: [ main, 'arena/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          echo "BUILD_EXIT=$?" >> "$GITHUB_ENV" || true

      - name: Diagnostics on failure
        if: failure()
        run: |
          mkdir -p ci
          grep -iE "error|FAILURE|Exception" build.log | head -60 > ci/errors.txt || true
          tail -100 build.log > ci/tail.txt || true
          git config user.name "lumi-ci"
          git config user.email "lumi-ci@users.noreply.github.com"
          git add ci/ || true
          git commit -m "ci: лог ошибок сборки [skip ci]" || exit 0
          BRANCH="${GITHUB_REF#refs/heads/}"
          git push origin "HEAD:$BRANCH" || echo "пуш лога не удался"

      - name: Prepare APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/Lumi-Chat-v2.0-debug.apk
          ls -la apk/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-APK
          path: apk/Lumi-Chat-v2.0-debug.apk
          if-no-files-found: error

      - name: Commit APK into branch (для скачивания из репозитория)
        run: |
          git config user.name "lumi-ci"
          git config user.email "lumi-ci@users.noreply.github.com"
          git add apk/Lumi-Chat-v2.0-debug.apk
          git commit -m "build: Lumi APK v2.0 [skip ci]" || exit 0
          BRANCH="${GITHUB_REF#refs/heads/}"
          git push origin "HEAD:$BRANCH" || echo "не удалось запушить APK в ветку, но артефакт собран"
